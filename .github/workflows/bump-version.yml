name: Bump Version

# Run this workflow from "Run workflow" on main and enter the version to release next.
# It rewrites the version in the package.json to that value and opens a pull request from
# release/<version> with the change. Merge it, then run "Build Release" to publish.
# Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
# in Settings > Actions > General (it also lets workflows approve pull requests); without it,
# a link to open one by hand is shown instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 次に出すバージョン（例 1.2.3。先頭に v は付けない）。package.json をこの値に書き換える PR を作ります
        required: true
        type: string

# Runs of the same version wait for each other so they never push the same branch at once.
# The input is used as it is, which is enough since only an exact version passes validation.
# GitHub keeps only one waiting run per group: a newer run of the same version replaces it.
concurrency:
  group: bump-version-${{ inputs.version }}
  cancel-in-progress: false

jobs:

  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate the version entered in "Run workflow". The inputs are passed through env so
      # they are never expanded into the scripts themselves.
      - name: Validate Version
        env:
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::リポジトリ変数 PACKAGE_NAME を設定してください"
            exit 1
          fi
          version="$VERSION_INPUT"
          # Semantic Versioning 2.0.0 without build metadata: no leading zeros in numbers,
          # prerelease identifiers separated by single dots
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^$num\.$num\.$num(-$pre(\.$pre)*)?$"
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::バージョンは 1.2.3 や 1.2.3-beta.1 の形で、先頭の v や空白を付けずに入力してください（数字の先頭の 0 や続けた . も使えません）"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$version"; then
            echo "::error::$version はタグの名前に使えません（末尾の .lock など）"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Bump Version はブランチ（ふつうは main）を選んで実行してください"
            exit 1
          fi
          # The published versions, also used by the next step
          if ! refs="$(git ls-remote --tags --refs origin)"; then
            echo "::error::タグの一覧を取得できませんでした"
            exit 1
          fi
          printf '%s\n' "$refs" | sed -n 's|^.*refs/tags/||p' > "$RUNNER_TEMP/tags"
          if grep -qxF -e "$version" -e "v$version" "$RUNNER_TEMP/tags"; then
            echo "::error::タグ $version はもうあります。まだ出していないバージョンを入力してください"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # Set the version in the package.json, keeping its indentation, line endings and byte
      # order mark. The version must come after the latest published one (tags that are not
      # versions are ignored); an unpublished version already in the package.json may be lowered.
      - name: Set Version
        run: |
          node - "$packagePath/package.json" "$version" "$RUNNER_TEMP/tags" <<'EOF'
          const fs = require('fs');
          const [file, version, tagsFile] = process.argv.slice(2);
          const text = fs.readFileSync(file, 'utf8');
          const bom = text.startsWith('\uFEFF') ? '\uFEFF' : '';
          const manifest = JSON.parse(text.slice(bom.length));

          const published = fs.readFileSync(tagsFile, 'utf8').split('\n')
            .map((tag) => tag.replace(/^v/, ''))
            .filter((tag) => /^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag));
          const latest = published.sort(compareVersions).pop();
          if (latest && compareVersions(version, latest) <= 0) {
            console.log(`::error::${version} は公開済みの最新 ${latest} より後のバージョンではありません`);
            process.exit(1);
          }

          manifest.version = version;
          const indent = /^[ \t]+(?=")/m.exec(text)?.[0] ?? '  ';
          const newline = text.includes('\r\n') ? '\r\n' : '\n';
          const json = JSON.stringify(manifest, null, indent).replace(/\n/g, newline);
          fs.writeFileSync(file, bom + json + (/\r?\n$/.test(text) ? newline : ''));

          // Semantic Versioning 2.0.0 precedence. Numbers are compared as digit strings so
          // leading zeros and values beyond Number precision are handled.
          function compareVersions(a, b) {
            const split = (v) => {
              const [core, ...pre] = v.split('-');
              return { core: core.split('.'), pre: pre.length ? pre.join('-').split('.') : [] };
            };
            const compareNumbers = (p, q) => {
              p = p.replace(/^0+(?=\d)/, '');
              q = q.replace(/^0+(?=\d)/, '');
              return p.length - q.length || (p < q ? -1 : p > q ? 1 : 0);
            };
            const x = split(a), y = split(b);
            for (let i = 0; i < 3; i++) {
              const order = compareNumbers(x.core[i], y.core[i]);
              if (order !== 0) return order;
            }
            if (x.pre.length === 0 || y.pre.length === 0) return y.pre.length - x.pre.length;
            for (let i = 0; i < Math.min(x.pre.length, y.pre.length); i++) {
              const p = x.pre[i], q = y.pre[i];
              const pNum = /^\d+$/.test(p), qNum = /^\d+$/.test(q);
              let order;
              if (pNum && qNum) order = compareNumbers(p, q);
              else if (pNum !== qNum) order = pNum ? -1 : 1;
              else order = p < q ? -1 : p > q ? 1 : 0;
              if (order !== 0) return order;
            }
            return x.pre.length - y.pre.length;
          }
          EOF

      # Commit the rewritten package.json to release/<version> and open a pull request into
      # the branch the workflow ran on. An open pull request from a previous run is left as it
      # is (pull requests from forks are ignored even when their branch has the same name).
      # A release/<version> that no open pull request uses is replaced only when it holds just
      # this workflow's commit, i.e. a previous run pushed it but could not open the pull request.
      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "::notice::package.json はすでに $version です。そのまま Build Release を実行してください"
            exit 0
          fi
          branch="release/$version"
          title="chore: バージョンを $version にする"
          prs="$(gh pr list --head "$branch" --state open --json url,baseRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | [.baseRefName, .url] | @tsv')"
          while IFS=$'\t' read -r base url; do
            if [ "$base" = "$GITHUB_REF_NAME" ]; then
              echo "::notice::$branch の pull request はもうあります: $url（$GITHUB_REF_NAME が進んでいたら、PR の Update branch で取り込んでください）"
              exit 0
            elif [ -n "$url" ]; then
              echo "::error::$branch は $base への pull request で使われています: $url"
              exit 1
            fi
          done <<< "$prs"
          if ! remote="$(git ls-remote --heads origin "refs/heads/$branch")"; then
            echo "::error::$branch があるかを確かめられませんでした"
            exit 1
          fi
          lease=""
          if [ -n "$remote" ]; then
            git fetch --depth 1 origin "refs/heads/$branch"
            if [ "$(git log -1 --format='%an %s' FETCH_HEAD)" != "github-actions[bot] $title" ]; then
              echo "::error::$branch に、このワークフローのもの以外のコミットがあります。中身を確かめてからブランチを消すか、別のバージョンで実行してください"
              exit 1
            fi
            lease="--force-with-lease=refs/heads/$branch:$(git rev-parse FETCH_HEAD)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$title" -- "$packagePath/package.json"
          git push ${lease:+"$lease"} origin "HEAD:refs/heads/$branch"
          body="package.json の version を $version にします。マージしたら Build Release を実行してください。"
          if out="$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" --body "$body" 2>&1)"; then
            echo "$out"
            exit 0
          fi
          echo "$out"
          # Only the missing repository setting falls back to a link; any other failure fails the run
          if ! grep -qi "not permitted to create" <<< "$out"; then
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1"
          echo "::warning::GitHub Actions に pull request を作る許可がありません（Allow GitHub Actions to create and approve pull requests）。$url から作ってください"
          echo "package.json を $version にする pull request: $url" >> "$GITHUB_STEP_SUMMARY"
