name: Bump Version

# Run this workflow from "Run workflow" on main and enter the version to release next.
# It rewrites only the version in the package.json to that value and opens a pull request
# from release/<version> with the change. Merge it, then run "Build Release" to publish.
# Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
# in Settings > Actions > General; without it, a link to open one by hand is shown instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 次に出すバージョン（例 1.2.3）。package.json をこの値に書き換える PR を作ります
        required: true
        type: string

# Runs of the same version wait for each other so they never push the same branch at once.
# GitHub keeps only one waiting run per group: a newer run of the same version replaces it.
concurrency:
  group: bump-version-${{ inputs.version }}
  cancel-in-progress: false

jobs:

  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate the version entered in "Run workflow" (surrounding spaces and a leading "v"
      # are dropped). The inputs are passed through env so they are never expanded into the
      # scripts themselves.
      - name: Validate Version
        env:
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::リポジトリ変数 PACKAGE_NAME を設定してください"
            exit 1
          fi
          version="$(printf '%s' "$VERSION_INPUT" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          version="${version#v}"
          # Semantic Versioning 2.0.0 without build metadata: no leading zeros in numbers,
          # prerelease identifiers separated by single dots
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^$num\.$num\.$num(-$pre(\.$pre)*)?$"
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::バージョンは 1.2.3 や 1.2.3-beta.1 の形で入力してください（先頭の 0 や続けた . は使えません）"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$version"; then
            echo "::error::$version はタグの名前に使えません（末尾の .lock など）"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Bump Version はブランチ（ふつうは main）を選んで実行してください"
            exit 1
          fi
          # The published versions, also used by the next step
          if ! refs="$(git ls-remote --tags --refs origin)"; then
            echo "::error::タグの一覧を取得できませんでした"
            exit 1
          fi
          printf '%s\n' "$refs" | sed -n 's|^.*refs/tags/||p' > "$RUNNER_TEMP/tags"
          if grep -qxF -- "$version" "$RUNNER_TEMP/tags"; then
            echo "::error::タグ $version はもうあります。まだ出していないバージョンを入力してください"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      # Rewrite only the top-level version in the package.json so the rest of the file stays
      # as written. On the default branch the version must come after the latest published one
      # (an unpublished version already in the package.json may be lowered); on other branches,
      # such as one for fixes to an older version, only an existing tag is rejected (above).
      - name: Set Version
        env:
          CHECK_LATEST: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          node - "$packagePath/package.json" "$version" "$RUNNER_TEMP/tags" <<'EOF'
          const fs = require('fs');
          const [file, version, tagsFile] = process.argv.slice(2);
          const text = fs.readFileSync(file, 'utf8');
          const parse = (json) => JSON.parse(json.replace(/^\uFEFF/, ''));
          const expected = JSON.stringify({ ...parse(text), version });

          // Replace the "version" value that turns out to be the top-level one, so a nested
          // "version" (and anything else) is never changed
          let updated;
          for (const match of text.matchAll(/("version"\s*:\s*")[^"]*(")/g)) {
            const candidate = text.slice(0, match.index) + match[1] + version + match[2] +
              text.slice(match.index + match[0].length);
            if (JSON.stringify(parse(candidate)) === expected) {
              updated = candidate;
              break;
            }
          }
          if (updated === undefined) {
            console.log(`::error::${file} の version を書き換えられませんでした`);
            process.exit(1);
          }

          if (process.env.CHECK_LATEST === 'true') {
            const published = fs.readFileSync(tagsFile, 'utf8').split('\n')
              .map((tag) => tag.replace(/^v/, ''))
              .filter((tag) => /^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag));
            const latest = published.sort(compareVersions).pop();
            if (latest && compareVersions(version, latest) <= 0) {
              console.log(`::error::${version} は公開済みの最新 ${latest} より後のバージョンではありません`);
              process.exit(1);
            }
          }
          fs.writeFileSync(file, updated);

          // Semantic Versioning 2.0.0 precedence. Numbers are compared as digit strings so
          // leading zeros and values beyond Number precision are handled.
          function compareVersions(a, b) {
            const split = (v) => {
              const [core, ...pre] = v.split('-');
              return { core: core.split('.'), pre: pre.length ? pre.join('-').split('.') : [] };
            };
            const compareNumbers = (p, q) => {
              p = p.replace(/^0+(?=\d)/, '');
              q = q.replace(/^0+(?=\d)/, '');
              return p.length - q.length || (p < q ? -1 : p > q ? 1 : 0);
            };
            const x = split(a), y = split(b);
            for (let i = 0; i < 3; i++) {
              const order = compareNumbers(x.core[i], y.core[i]);
              if (order !== 0) return order;
            }
            if (x.pre.length === 0 || y.pre.length === 0) return y.pre.length - x.pre.length;
            for (let i = 0; i < Math.min(x.pre.length, y.pre.length); i++) {
              const p = x.pre[i], q = y.pre[i];
              const pNum = /^\d+$/.test(p), qNum = /^\d+$/.test(q);
              let order;
              if (pNum && qNum) order = compareNumbers(p, q);
              else if (pNum !== qNum) order = pNum ? -1 : 1;
              else order = p < q ? -1 : p > q ? 1 : 0;
              if (order !== 0) return order;
            }
            return x.pre.length - y.pre.length;
          }
          EOF

      # Commit the rewritten package.json to release/<version> and open a pull request into
      # the branch the workflow ran on. An open pull request from a previous run is left as it
      # is. A release/<version> that no open pull request uses (a previous run pushed it but
      # could not open one) is replaced with this run's commit, unless it moved meanwhile.
      # Pull requests from forks are ignored even when their branch has the same name.
      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "::notice::package.json はすでに $version です。そのまま Build Release を実行してください"
            exit 0
          fi
          branch="release/$version"
          title="chore: バージョンを $version にする"
          prs="$(gh pr list --head "$branch" --state open --json url,baseRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.baseRefName) \(.url)"')"
          pr="$(awk -v base="$GITHUB_REF_NAME" '$1 == base { print $2; exit }' <<< "$prs")"
          if [ -n "$pr" ]; then
            echo "::notice::$branch の pull request はもうあります: $pr（$GITHUB_REF_NAME が進んでいたら、PR の Update branch で取り込んでください）"
            exit 0
          fi
          if [ -n "$prs" ]; then
            echo "::error::$branch は、ほかのブランチへの pull request で使われています: $prs"
            exit 1
          fi
          if ! remote="$(git ls-remote --heads origin "refs/heads/$branch")"; then
            echo "::error::$branch があるかを確かめられませんでした"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$title" -- "$packagePath/package.json"
          if [ -n "$remote" ]; then
            git push --force-with-lease="refs/heads/$branch:${remote%%[[:space:]]*}" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          body="package.json の version を $version にします。マージしたら Build Release を実行してください。"
          if out="$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" --body "$body" 2>&1)"; then
            echo "$out"
            exit 0
          fi
          echo "$out"
          # Only the missing repository setting falls back to a link; any other failure fails the run
          if ! grep -q "not permitted to create or approve pull requests" <<< "$out"; then
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1"
          echo "::warning::GitHub Actions に pull request を作る許可がありません（Allow GitHub Actions to create and approve pull requests）。$url から作ってください"
          echo "package.json を $version にする pull request: $url" >> "$GITHUB_STEP_SUMMARY"
