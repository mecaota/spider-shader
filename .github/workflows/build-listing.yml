name: Build Repo Listing

# Builds the VPM repository listing (index.json) from the GitHub Releases and the
# landing page (index.html) from README.md, then deploys both to GitHub Pages.
# LISTING_URL must be the public URL of index.json, including the custom domain
# configured for GitHub Pages.
#
# Releases created by the "Build Release" workflow are picked up through the
# workflow_run trigger. Releases created or edited by hand do not trigger this
# workflow (and a release event would run on the tag ref, which the github-pages
# environment cannot deploy from), so run it manually with "Run workflow" on main.
env:
  LISTING_URL: https://github.pito.run/spider-shader/index.json
  SITE_DIR: _site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - Website/**
      - .github/scripts/**
      - .github/workflows/build-listing.yml
  workflow_run:
    workflows: [Build Release]
    types:
      - completed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # Build the VPM listing and the website
  build:
    name: build
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install build dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Build listing and website
        run: node .github/scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.SITE_DIR }}

  # Deploy the uploaded website to GitHub Pages.
  # The github-pages environment only accepts deployments from the default branch,
  # so runs on other branches (e.g. workflow_dispatch for testing) build only.
  deploy:
    name: deploy
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
